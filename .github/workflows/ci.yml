name: CI

# this repo's own pipeline is the shared library workflow run against
# test/fixture, so every change to the workflow, the seed or the gate is
# exercised the way a library uses it. a pull request into dev runs the light
# legs, x86_64-linux and the promoted aarch64-linux, and a pull request into
# main runs every leg including the qemu leg and the standalone seed. nothing runs on push.

on:
  pull_request:
  workflow_dispatch:
    inputs:
      heavy:
        description: heavy work to run on this ref
        type: choice
        default: none
        options: [none, all, aarch64-linux, x86_64-windows, aarch64-darwin, x86_64-darwin, riscv64-linux, seed-latest]

permissions:
  contents: read

jobs:
  toolkit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - name: script tests
        run: |
          set -euo pipefail
          python3 .github/actions/seed-mach/test-verify.py
          python3 .github/actions/gate/test-gate.py
          python3 .github/mach-lib/test-plan.py
          python3 .github/mach-lib/test-run.py
          python3 tools/preflight/test-preflight.py
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: actionlint
        run: |
          set -euo pipefail
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          "$(go env GOPATH)/bin/actionlint" -color

  # the seed and leg scripts also run on windows and darwin legs, where paths
  # and interpreters differ, so their tests run there too
  host-scripts:
    name: host-scripts ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-15]
    steps:
      - uses: actions/checkout@v6
      - name: script tests
        shell: bash
        run: |
          set -euo pipefail
          python .github/actions/seed-mach/test-verify.py
          python .github/mach-lib/test-run.py

  fixture:
    uses: ./.github/workflows/mach-lib.yml
    with:
      heavy: ${{ inputs.heavy }}
      project: test/fixture
      hooks-dir: test/fixture/ci
      profiles: '["debug", "release", "fast"]'
      light-legs: '["aarch64-linux"]'
      extra-legs: >-
        [{"name": "riscv64-linux", "runs-on": "ubuntu-latest", "tier": "heavy",
          "target": "linux-riscv64", "runner": "qemu-riscv64", "test-args": ["--jobs", "1"],
          "apt": ["qemu-user"]}]
      subprojects: >-
        [{"path": "test/fixture/consumer", "clean-dep": true},
         {"path": "test/fixture/examples/*", "build": true, "test": false}]
      evidence: test/fixture/out/

  # a caller-owned heavy job seeding directly, twice: the family pin, then the
  # newest published release, which must win and stay outside the workspace
  seed-latest:
    if: github.base_ref == 'main' || inputs.heavy == 'all' || inputs.heavy == 'seed-latest'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - name: seed pin
        uses: ./.github/actions/seed-mach
      - name: seed latest
        id: seed
        uses: ./.github/actions/seed-mach
        with:
          tag: latest
      - name: report
        env:
          TAG: ${{ steps.seed.outputs.tag }}
          COMPILER: ${{ steps.seed.outputs.compiler }}
        run: |
          set -euo pipefail
          mach info
          [ "$(command -v mach)" = "$COMPILER" ] || { echo "::error::mach on PATH is $(command -v mach), not the latest seed $COMPILER"; exit 1; }
          [ "v$(mach info --version)" = "$TAG" ] || { echo "::error::mach on PATH is not $TAG"; exit 1; }
          case "$COMPILER" in "$GITHUB_WORKSPACE"/*) echo "::error::the seed landed in the workspace"; exit 1 ;; esac
          [ -z "$(git status --porcelain --ignored)" ] || { git status --porcelain --ignored; echo "::error::seeding left files in the workspace"; exit 1; }
          echo "seeded $TAG"

  gate:
    if: always()
    needs: [toolkit, host-scripts, fixture, seed-latest]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout: .github/actions/gate
      - uses: ./.github/actions/gate
        with:
          needs: ${{ toJSON(needs) }}
