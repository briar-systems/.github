name: seed mach
description: install and verify the published mach compiler for this runner

inputs:
  tag:
    description: published release tag to install, empty for the family pin in ./version, or latest for the newest published release
    required: false
    default: ""
  token:
    description: token used to read the release
    required: false
    default: ${{ github.token }}

outputs:
  tag:
    description: verified published release tag
    value: ${{ steps.resolve.outputs.tag }}
  compiler:
    description: absolute path to the verified installed compiler
    value: ${{ steps.verify.outputs.compiler }}

runs:
  using: composite
  steps:
    - name: resolve published release
      id: resolve
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        RELEASE_TAG: ${{ inputs.tag }}
        ACTION_PATH: ${{ github.action_path }}
      run: |
        set -euo pipefail
        case "$RUNNER_OS/$RUNNER_ARCH" in
          Linux/X64) host=x86_64-linux; ext=tar.gz ;;
          Linux/ARM64) host=aarch64-linux; ext=tar.gz ;;
          Windows/X64) host=x86_64-windows; ext=zip ;;
          macOS/X64) host=x86_64-darwin; ext=tar.gz ;;
          macOS/ARM64) host=aarch64-darwin; ext=tar.gz ;;
          *) echo "::error::no published mach seed for $RUNNER_OS/$RUNNER_ARCH"; exit 1 ;;
        esac
        # the family pin lives in ./version, beside this action
        case "$RELEASE_TAG" in
          "") RELEASE_TAG=$(tr -d '[:space:]' < "$ACTION_PATH/version"); release="tags/$RELEASE_TAG" ;;
          latest) RELEASE_TAG=; release=latest ;;
          *) release="tags/$RELEASE_TAG" ;;
        esac
        # each invocation seeds its own directory outside the workspace
        dir=$(mktemp -d "$RUNNER_TEMP/mach-seed.XXXXXX")
        echo "dir=$dir" >> "$GITHUB_OUTPUT"
        gh api "repos/briar-systems/mach/releases/$release" > "$dir/release.json"
        python "$ACTION_PATH/verify.py" resolve "$dir/release.json" "$RELEASE_TAG" "$host" "$ext"
    - name: download and verify archive before extraction
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        TAG: ${{ steps.resolve.outputs.tag }}
        ASSET: ${{ steps.resolve.outputs.asset }}
        SEED_DIR: ${{ steps.resolve.outputs.dir }}
        ACTION_PATH: ${{ github.action_path }}
      run: |
        set -euo pipefail
        gh release download "$TAG" -R briar-systems/mach -p "$ASSET" -p SHA256SUMS -D "$SEED_DIR"
        python "$ACTION_PATH/verify.py" archive "$SEED_DIR/$ASSET" "$SEED_DIR/SHA256SUMS"
    - name: install native seed
      if: runner.os != 'Windows'
      shell: bash
      env:
        ASSET: ${{ steps.resolve.outputs.asset }}
        SEED_DIR: ${{ steps.resolve.outputs.dir }}
      run: |
        set -euo pipefail
        tar -xzf "$SEED_DIR/$ASSET" -C "$SEED_DIR" mach
        chmod +x "$SEED_DIR/mach"
        echo "$SEED_DIR" >> "$GITHUB_PATH"
    - name: install native seed
      if: runner.os == 'Windows'
      shell: pwsh
      env:
        ASSET: ${{ steps.resolve.outputs.asset }}
        SEED_DIR: ${{ steps.resolve.outputs.dir }}
      run: |
        $ErrorActionPreference = 'Stop'
        $dir = $env:SEED_DIR
        Expand-Archive -Path (Join-Path $dir $env:ASSET) -DestinationPath $dir
        Add-Content -Path $env:GITHUB_PATH -Value $dir
    - name: verify installed version and record provenance
      id: verify
      shell: bash
      env:
        TAG: ${{ steps.resolve.outputs.tag }}
        ASSET: ${{ steps.resolve.outputs.asset }}
        SEED_DIR: ${{ steps.resolve.outputs.dir }}
        ACTION_PATH: ${{ github.action_path }}
      run: python "$ACTION_PATH/verify.py" installed "$SEED_DIR" "$TAG" "$ASSET"
