[project]
id      = "ditfixture"
version = "0.1.0"
mach    = "^5.8"
src     = "src"
out     = "out/{target.name}/{profile.name}"

[target.linux-x86_64]
isa = "x86_64"
os  = "linux"
abi = "sysv64"

[target.linux-arm64]
isa = "aarch64"
os  = "linux"
abi = "aapcs64"

[target.darwin-aarch64]
isa = "aarch64"
os  = "darwin"
abi = "aapcs64"

[profile.debug]
default = true
opt   = 0
debug = true
simd  = "scalarize"
vectorize     = false
float_reassoc = false

[profile.release]
opt   = 2
debug = false
simd  = "scalarize"
vectorize     = true
float_reassoc = false

[profile.fast]
opt   = 2
debug = false
simd  = "scalarize"
vectorize     = true
float_reassoc = false

[artifact.ditfixture]
kind    = "static"
entry   = "lib.mach"
out     = "lib/ditfixture"
targets = ["*"]
link    = []
need    = []

# std 5.8.0 is the first whose start turns PSTATE.DIT on for a link that
# admits a secret multiply, and refuses on a processor without the mode
[dep.std]
git = "https://github.com/briar-systems/mach-std"
ref = "tag/v5.8.0"
